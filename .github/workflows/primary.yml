name: primary

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  install-test:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2

      - name: Setup node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm test
      - run: pnpm format:check
