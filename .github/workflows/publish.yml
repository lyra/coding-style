name: publish

on: workflow_dispatch

permissions:
  contents: write # to check out repo (actions/checkout) and to create releases (changesets/action/publish)
  id-token: write # for trusted publishing (changesets/action/publish)

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup pnpm
        uses: pnpm/setup@v2

      - name: Setup node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # recommended: avoid cache poisoning

      - run: pnpm install

      - name: Publish packages to npm
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
